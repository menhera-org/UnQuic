[package]
name = "unquic"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["metastable-void <mori@menhera.ad.jp>"]
license = "(Apache-2.0 OR MPL-2.0) AND BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/menhera-org/UnQuic"
description = "experimental user-space L2 encapsulation for kernel Linux"

[dependencies]
iphost = { version = "=0.4.4", default-features = false, features = ["ra", "dhcpv6"], optional = true }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"], optional = true }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"], optional = true }
uuid = { version = "1.29.0", default-features = false, optional = true }

[features]
dns = ["dep:iphost"]
uuid-compat = ["dep:uuid"]
bin = ["dns", "dep:serde", "dep:toml", "iphost/serde"]
# Diagnostics only: per-worker event rings. Never enable for production or acceptance runs.
trace = []
# Diagnostics only: per-phase worker cycle totals printed at shutdown.
profile = []

[[bin]]
name = "unquic"
path = "src/bin/unquic.rs"
required-features = ["bin"]

[[bench]]
name = "cookie_lookup"
harness = false

[[bench]]
name = "reassembly"
harness = false

[[bench]]
name = "tap_cost"
harness = false

[[example]]
name = "udp_load"
test = true

[[example]]
name = "path_relay"
test = true

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

# Packages are built by packaging/build.sh, which first writes the unit the
# daemon prints for these installed paths to target/package/unquic.service.
# Neither package enables or starts the service: it needs a configuration
# file with provisioned cookies first.
[package.metadata.deb]
section = "net"
priority = "optional"
extended-description = """\
UnQuic carries Ethernet frames between TAP devices over IPv6 UDP, with \
selective repair and BBRv3 congestion control. The daemon is one static \
binary; write /etc/unquic/unquic.toml, then enable unquic.service."""
assets = [
    ["target/release/unquic", "usr/bin/", "755"],
    ["target/package/unquic.service", "usr/lib/systemd/system/", "644"],
    ["README.md", "usr/share/doc/unquic/", "644"],
    ["config-model.md", "usr/share/doc/unquic/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/unquic/", "644"],
    ["LICENSE-MPL", "usr/share/doc/unquic/", "644"],
    ["LICENSE-BBR", "usr/share/doc/unquic/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/unquic", dest = "/usr/bin/unquic", mode = "755" },
    { source = "target/package/unquic.service", dest = "/usr/lib/systemd/system/unquic.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/unquic/README.md", mode = "644", doc = true },
    { source = "config-model.md", dest = "/usr/share/doc/unquic/config-model.md", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/unquic/LICENSE-APACHE", mode = "644" },
    { source = "LICENSE-MPL", dest = "/usr/share/licenses/unquic/LICENSE-MPL", mode = "644" },
    { source = "LICENSE-BBR", dest = "/usr/share/licenses/unquic/LICENSE-BBR", mode = "644" },
]
